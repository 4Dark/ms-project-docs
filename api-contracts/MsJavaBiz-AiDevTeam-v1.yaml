openapi: 3.0.0
info:
  title: ms-java-biz AI Dev Team API
  description: API for managing AI Dev Team tasks (fetching status, resuming, and rolling back tasks)
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /rest/biz/v1/ai-dev/tasks:
    get:
      summary: Get all AI Dev tasks
      description: Retrieve a list of all AI development tasks along with their current status and costs.
      operationId: listAiDevTasks
      tags:
        - AiDevTask
      responses:
        '200':
          description: A list of AI Dev tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiDevTaskResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /rest/biz/v1/ai-dev/tasks/{id}/resume:
    post:
      summary: Resume a paused AI Dev task
      description: Triggers the underlying LangGraph engine to resume a task that was paused pending human approval.
      operationId: resumeAiDevTask
      tags:
        - AiDevTask
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the task to resume
          schema:
            type: string
      responses:
        '200':
          description: Task successfully resumed
        '400':
          description: Invalid task ID
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /rest/biz/v1/ai-dev/tasks/{id}/rollback:
    post:
      summary: Rollback an AI Dev task
      description: Rejects a task, deletes the associated Git branch across all modified workspaces, and rolls back the state.
      operationId: rollbackAiDevTask
      tags:
        - AiDevTask
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the task to rollback
          schema:
            type: string
      responses:
        '200':
          description: Task successfully rolled back
        '400':
          description: Invalid task ID
        '401':
          description: Unauthorized
        '404':
          description: Task not found

  /rest/biz/v1/ai-dev/profiles:
    get:
      summary: Get all AI Dev Agent Profiles
      description: Retrieve a list of all configured AI agent profiles (e.g., Planner, Coder, Reviewer).
      operationId: listAiDevAgentProfiles
      tags:
        - AiDevProfile
      responses:
        '200':
          description: A list of AI Dev Agent Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiDevAgentProfileDTO'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /rest/biz/v1/ai-dev/profiles/{roleName}:
    put:
      summary: Update an AI Dev Agent Profile
      description: Updates the configuration for a specific AI agent role.
      operationId: updateAiDevAgentProfile
      tags:
        - AiDevProfile
      parameters:
        - name: roleName
          in: path
          required: true
          description: The role name of the agent to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiDevAgentProfileDTO'
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiDevAgentProfileDTO'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '404':
          description: Profile not found

components:
  schemas:
    AiDevTaskResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the task
        title:
          type: string
          description: Short title of the task
        description:
          type: string
          description: Detailed description of the task requirements
        status:
          type: string
          description: Current status of the task (e.g., PLANNING, GENERATING, WAITING_ON_APPROVAL, COMPLETED)
        branchName:
          type: string
          description: Name of the Git branch used for isolation
        totalCost:
          type: number
          format: float
          description: Total LLM API cost incurred by the task (in USD)
        createTime:
          type: string
          format: date-time
          description: Timestamp when the task was created
        updateTime:
          type: string
          format: date-time
          description: Timestamp when the task was last updated

    AiDevAgentProfileDTO:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the profile
        roleName:
          type: string
          description: The name of the AI role (e.g., PLANNER, CODER)
        baseUrl:
          type: string
          description: The base URL of the LLM API
        apiToken:
          type: string
          description: The API token for authentication
        modelName:
          type: string
          description: The model name to use
        avatar:
          type: string
          description: Avatar URL for the agent
        systemPrompt:
          type: string
          description: The system prompt guiding the agent's behavior
